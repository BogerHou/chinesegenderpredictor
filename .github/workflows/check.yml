name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate the production build
        run: npm run build:verified
        env:
          SITE_URL: https://chinesegenderpredictor.net
          VERCEL_ENV: production
      - name: Verify that previews remain noindex
        run: npm run build && npm run check
        env:
          SITE_URL: https://chinesegenderpredictor.net
          VERCEL_ENV: preview
